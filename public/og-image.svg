<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="url(#glow)"/>
  <text x="600" y="260" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">Felipe Souza Nascimento</text>
  <text x="600" y="330" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">Web Designer & Web Developer</text>
  <text x="600" y="410" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">Transformo ideias em experiências digitais</text>
  <g transform="translate(600, 500)">
    <circle r="30" fill="#0ea5e9" opacity="0.2"/>
    <path d="M-10 0L0 10L20 -10" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>